<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tablica pasażerska GZM</title>
  <link rel="stylesheet" href="/display/style.css">
</head>
<body>
  <main class="display">
    <section class="line-column">
      <div class="line-number" id="lineNumber">M3</div>
      <div class="times" id="times"></div>
    </section>

    <section class="route-column">
      <div class="stops" id="stops"></div>
    </section>

    <footer class="direction-bar">
      <span>Kierunek:</span>
      <strong id="direction">---</strong>
    </footer>

    <div class="brand">
      <strong class="brand-logo">ZTM</strong>
      <span id="date">--.--.----</span>
      <strong id="clock">--:--</strong>
    </div>
  </main>

  <script src="/display/app.js"></script>
</body>
</html>
